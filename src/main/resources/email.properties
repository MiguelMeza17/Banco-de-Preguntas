# Configuración SMTP para las notificaciones de asignación de revisores (HU04).
# Si smtp.host queda vacío, el sistema solo registra la notificación en consola
# (no falla la asignación de revisores).
#
# Ejemplo para Gmail (requiere una "contraseña de aplicación", no la contraseña normal):
#   smtp.host=smtp.gmail.com
#   smtp.port=587
#   smtp.username=tu_correo@gmail.com
#   smtp.password=contraseña_de_aplicacion
#   smtp.from=tu_correo@gmail.com

smtp.host=
smtp.port=587
smtp.auth=true
smtp.starttls=true
smtp.username=
smtp.password=
smtp.from=
