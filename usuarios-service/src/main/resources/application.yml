server:
  port: 8081

spring:
  application:
    name: usuarios-service
  datasource:
    url: jdbc:h2:file:./data/usuarios-db;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
